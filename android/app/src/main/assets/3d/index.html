<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simulador PC</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0b0c10;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }
    
    /* Controles de Dissecção */
    .controls {
      position: absolute;
      bottom: 20px;
      left: 0;
      right: 0;
      padding: 10px 20px;
      display: flex;
      gap: 12px;
      overflow-x: auto;
      z-index: 10;
      justify-content: center;
    }
    
    .chip {
      background: rgba(47, 84, 255, 0.9);
      border: 1px solid #4D6BFF;
      color: white;
      padding: 12px 20px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(47, 84, 255, 0.4);
    }
    
    .chip:active {
      transform: scale(0.95);
    }
    
    .chip.hidden {
      background: rgba(40, 40, 40, 0.8);
      color: #999;
      border-color: #555;
      box-shadow: none;
    }

    .title-bar {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      z-index: 10;
    }
    .title-bar h1 {
      margin: 0;
      font-size: 20px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .title-bar p {
      margin: 4px 0 0 0;
      font-size: 12px;
      color: #aaa;
    }
  </style>
  <script src="./model-viewer-legacy.js"></script>
</head>
<body>

  <div class="title-bar">
    <h1>Custom Gaming PC</h1>
    <p>Gire e dê zoom. Clique para dissecar.</p>
  </div>

  <model-viewer 
    id="pc-viewer"
    src="./models/pc/scene.gltf" 
    camera-controls 
    auto-rotate 
    rotation-per-second="15deg"
    shadow-intensity="1"
    environment-image="neutral"
    exposure="1"
    interaction-prompt="none"
  >
    <div class="controls">
      <button class="chip" onclick="toggleMesh('gabinete', this)">Gabinete 👁️</button>
      <button class="chip" onclick="toggleMesh('placa', this)">Placa-mãe 👁️</button>
      <button class="chip" onclick="toggleMesh('cooler', this)">Refrigeração 👁️</button>
    </div>
  </model-viewer>

  <script>
    const modelViewer = document.querySelector('#pc-viewer');
    
    modelViewer.addEventListener('error', (event) => {
      console.error('MODEL LOAD ERROR: ' + JSON.stringify(event.detail));
    });

    function toggleMesh(partName, btn) {
      const isHidden = btn.classList.contains('hidden');
      
      if (isHidden) {
        btn.classList.remove('hidden');
        btn.innerHTML = btn.innerHTML.replace('❌', '👁️');
      } else {
        btn.classList.add('hidden');
        btn.innerHTML = btn.innerHTML.replace('👁️', '❌');
      }
    }
  </script>
</body>
</html>
